name: CI & SOC2 Compliance

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: beacon-node-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  security-audit:
    name: CVE Vulnerability Scan & Secret Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy Vulnerability Scanner (CVEs)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1

      - name: Secret Scan
        run: |
          if grep -rn \
            -e 'password\s*=\s*"[^"]\+"' \
            -e 'private_key\s*=\s*"[^"]\+"' \
            -e 'AIza[0-9A-Za-z-_]{35}' \
            --include="*.ts" \
            --include="*.js" \
            --exclude-dir=".git" \
            --exclude-dir="node_modules" \
            .; then
            echo "❌ Hardcoded secret pattern detected"
            exit 1
          fi
          echo "✅ No hardcoded secrets detected"

  soc2-verification-passed:
    name: SOC2 Verification & Flow Check
    runs-on: ubuntu-latest
    needs: [test, security-audit]
    if: always()
    steps:
      - name: Enforce All SOC2 Gates Passed
        run: |
          if [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.security-audit.result }}" != "success" ]; then
            echo "❌ SOC2 compliance check failed."
            exit 1
          fi
          echo "✅ All SOC2 security, CVE scan, and test gates passed."
